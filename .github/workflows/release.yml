name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      # A tag that disagrees with the project version publishes the wrong thing under the
      # right name, and a version on PyPI can never be replaced. So it is checked first.
      - name: Verify version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "Tag $TAG, project version $VERSION."
          test "$TAG" = "$VERSION"

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/callsy-cdk-db-readonly-role

    # Only this job mints the OIDC token. Building stays unprivileged, so anything injected
    # into the build can not reach the credential.
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # No token and no password. PyPI trusted publishing mints a short lived credential
      # from the OIDC token above, and signs an attestation with the same identity.
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
